<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 만족도 조사</title>
<style>
  :root{
    --ink:#1C2430;
    --paper:#EFEDE6;
    --surface:#FFFFFF;
    --line:#E3E0D8;
    --line-strong:#CFCBC0;
    --muted:#83807A;
    --accent:#7A2E3D;
    --accent-soft:#F3E4E7;
    --accent-strong:#5C2130;
    --success:#3E6B52;
    --success-soft:#E4EEE8;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .app{
    font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:24px 0 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .device{

    width:100%;
    max-width:820px;
    background:var(--surface);
    border-radius:28px;
    border:1px solid var(--line-strong);
    box-shadow:0 24px 48px -20px rgba(28,36,48,0.28);
    overflow:hidden;
  }
  .statusbar{
    background:var(--ink);
    color:#fff;
    padding:10px 20px;
    font-size:11px;
    letter-spacing:.06em;
    font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  .screen{max-height:78vh;overflow-y:auto;padding:28px 26px 100px;}

  .intro{text-align:center;margin-bottom:26px;}
  .intro h1{font-family:ui-serif,Georgia,serif;font-size:21px;margin:0 0 8px;font-weight:600;}
  .intro p{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0;max-width:480px;margin:0 auto;}

  .q-block{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:10px;
  }
  .q-title{font-size:13.5px;font-weight:700;margin-bottom:12px;line-height:1.5;}
  .info-block{background:var(--paper);border-style:dashed;}
  .info-title{font-weight:500;color:var(--muted);font-size:12.5px;line-height:1.65;margin-bottom:0;}

  .scale-row{display:flex;gap:10px;justify-content:center;}
  .opt-btn{

    width:32px;height:32px;border-radius:50%;flex:0 0 auto;
    border:1.5px solid var(--line-strong);background:#fff;color:var(--muted);
    font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;transition:all .12s;
  }
  .opt-btn.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
  .scale-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--muted);}

  .yn-row{display:flex;gap:10px;justify-content:center;}
  .yn-btn{
    flex:0 0 auto;padding:8px 22px;border-radius:8px;
    border:1.5px solid var(--line-strong);background:#fff;color:var(--muted);
    font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s;
  }
  .yn-btn.selected{background:var(--accent);border-color:var(--accent);color:#fff;}

  .multi-row{display:flex;flex-wrap:wrap;gap:8px;}
  .multi-btn{
    flex:0 0 auto;padding:9px 14px;border-radius:999px;
    border:1.5px solid var(--line-strong);background:#fff;color:var(--muted);
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s;
  }
  .multi-btn.selected{background:var(--accent);border-color:var(--accent);color:#fff;}

  .submit-row{margin-top:18px;}
  .submit-btn{
    width:100%;padding:15px;border:none;border-radius:12px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .submit-btn:disabled{background:var(--line-strong);color:var(--muted);cursor:not-allowed;}
  .submit-hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:10px;}


  .done-state{text-align:center;padding:60px 24px;}
  .done-state .check{
    width:60px;height:60px;border-radius:50%;background:var(--success-soft);color:var(--success);
    display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;
  }
  .done-state h3{font-size:18px;margin:0 0 8px;}
  .done-state p{font-size:13px;color:var(--muted);line-height:1.6;margin:0;}
</style>
</head>
<body>
<div class="app">
  <div class="device">
    <div class="statusbar">YK LAW · 상담 만족도 조사</div>
    <div class="screen" id="surveyScreen">
      <div class="intro">
        <h1>상담은 어떠셨나요?</h1>
        <p>잠시 자리를 비운 동안, 간단한 설문에 답해주시면<br>더 나은 상담 서비스를 만드는 데 큰 도움이 됩니다.</p>
      </div>
      <div id="qContainer"></div>
      <div class="submit-row">
        <button class="submit-btn" id="submitBtn" disabled onclick="submitSurvey()">제출하기</button>
        <div class="submit-hint">모든 항목에 응답하시면 제출할 수 있습니다</div>
      </div>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  { id:'notice', type:'info', text:'이 설문 결과는 상담을 진행하신 변호사(실장)님께 공개되지 않으며, 계약 진행 여부에도 전혀 영향을 주지 않습니다. 편하게 솔직한 의견을 남겨주세요.' },
  { id:'q1', type:'scale', text:'상담 예약 과정은 편리하셨나요?', lo:'매우 불편', hi:'매우 편리' },
  { id:'q2', type:'scale', text:'상담 시작 전 대기 시간은 적절했나요?', lo:'많이 길었다', hi:'적절했다' },

  { id:'q3', type:'scale', text:'상담 과정에서 편안함을 느끼셨나요?', lo:'전혀 아니다', hi:'매우 그렇다' },
  { id:'q4', type:'scale', text:'상담 변호사(실장)의 설명은 이해하기 쉬웠나요?', lo:'어려웠다', hi:'쉬웠다' },
  { id:'consent', type:'yn', text:'상담 내용을 음성으로 남겨, 더 나은 상담 준비에 참고해도 괜찮을까요?' },
  { id:'expect', type:'multi', text:'계약을 진행하신다면, 어떤 점을 가장 기대하시나요? (복수 선택 가능)',
    options:['신속한 사건 처리', '정기적인 진행 상황 공유', '합리적인 비용', '전문성 있는 변호사 배정', '편안하고 신뢰할 수 있는 소통', '원하는 결과(승소·합의 등) 달성'] },
  { id:'q5', type:'scale', text:'계약 조건에 대한 설명은 충분했나요?', lo:'부족했다', hi:'충분했다' },
  { id:'q6', type:'scale', text:'오늘 상담에 전반적으로 만족하시나요?', lo:'불만족', hi:'매우 만족' },
  { id:'q7', type:'scale', text:'주변에 저희 상담을 추천할 의향이 있으신가요?', lo:'전혀 없다', hi:'매우 많다' }
];

const answers = {};
QUESTIONS.forEach(q => answers[q.id] = null);

function renderQuestions(){
  const container = document.getElementById('qContainer');
  container.innerHTML = QUESTIONS.map(q=>{
    if(q.type === 'info'){
      return `
      <div class="q-block info-block">
        <div class="q-title info-title">${q.text}</div>
      </div>`;
    }
    if(q.type === 'scale'){
      return `
      <div class="q-block">
        <div class="q-title">${q.text}</div>
        <div class="scale-row" data-q="${q.id}">
          ${[1,2,3,4,5].map(n=>`<button class="opt-btn" onclick="selectAnswer('${q.id}',${n})">${n}</button>`).join('')}
        </div>
        <div class="scale-labels"><span>${q.lo}</span><span>${q.hi}</span></div>
      </div>`;
    }

    if(q.type === 'multi'){
      return `
      <div class="q-block">
        <div class="q-title">${q.text}</div>
        <div class="multi-row" data-q="${q.id}">
          ${q.options.map(opt=>`<button class="multi-btn" onclick="toggleMulti('${q.id}','${opt}')">${opt}</button>`).join('')}
        </div>
      </div>`;
    }
    return `
      <div class="q-block">
        <div class="q-title">${q.text}</div>
        <div class="yn-row" data-q="${q.id}">
          <button class="yn-btn" onclick="selectAnswer('${q.id}','Y')">네</button>
          <button class="yn-btn" onclick="selectAnswer('${q.id}','N')">아니요</button>
        </div>
      </div>`;
  }).join('');
}

function selectAnswer(qid, value){
  answers[qid] = value;
  const row = document.querySelector(`[data-q="${qid}"]`);
  [...row.children].forEach(btn=>{
    const match = btn.textContent.trim() == String(value) || (value==='Y'&&btn.textContent.trim()==='네') || (value==='N'&&btn.textContent.trim()==='아니요');
    btn.classList.toggle('selected', match);
  });
  checkComplete();
}
function toggleMulti(qid, opt){
  if(!Array.isArray(answers[qid])) answers[qid] = [];
  const idx = answers[qid].indexOf(opt);

  if(idx === -1) answers[qid].push(opt); else answers[qid].splice(idx,1);
  const row = document.querySelector(`[data-q="${qid}"]`);
  [...row.children].forEach(btn=>{
    btn.classList.toggle('selected', answers[qid].includes(btn.textContent.trim()));
  });
  checkComplete();
}
function checkComplete(){
  const allAnswered = QUESTIONS.filter(q => q.type !== 'info').every(q=>{
    const a = answers[q.id];
    return q.type === 'multi' ? Array.isArray(a) && a.length > 0 : a !== null;
  });
  document.getElementById('submitBtn').disabled = !allAnswered;
}
function submitSurvey(){
  document.getElementById('surveyScreen').innerHTML = `
    <div class="done-state">
      <div class="check">&#10003;</div>
      <h3>설문에 참여해주셔서 감사합니다</h3>
      <p>소중한 의견 잘 전달됐습니다.<br>곧 상담실장님과 변호사님이 돌아오실 예정입니다.</p>
    </div>`;
}
renderQuestions();
</script>
</body>
</html>
