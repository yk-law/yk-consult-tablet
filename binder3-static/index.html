<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>바인더#3 검토본</title>
<link rel="stylesheet" href="binder3.css?v=profile-back-over-video">
<link rel="stylesheet" href="review.css">
</head>
<body>
<!--
  수정 안내
  - 화면 마크업은 아래 <template> 안에 그대로 있다. 디자인은 여기와 binder3.css 만 고치면 된다.
  - {{이름}} 값 자리, data-if / data-unless 조건, data-each="항목 in 목록" 반복, data-action 버튼 동작이다.
  - 데이터는 data.js 에 고정되어 있다. 콜 내용은 더미다.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M5 12h14"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
  <symbol id="i-chev-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-chev-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-chev-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-up-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10M7 17 17 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
</svg>
<div id="app"></div>

<!-- 검토용: 사건 고르기 (실제 태블릿에는 없는 화면) -->
<template id="tpl-picker">
  <main class="review-picker">
    <h1>상담 태블릿 바인더#3 검토본</h1>
    <p>더미 콜 내용으로 만든 고정 화면입니다. 사건을 고르면 고객 태블릿 흐름이 처음부터 시작됩니다. (생성 {{generatedAt}})</p>
    <ul>
      <li data-each="c in cases">
        <button type="button" data-action="pick" data-arg="{{c.id}}">
          <strong>{{c.fieldLabel}}</strong>
          <span>상담 변호사 {{c.counselName}}</span>
          <span>{{c.partyLabel}}</span>
          <span>문항 {{c.questions.length}}개 · 맞춤 설명 {{c.rewrites.length}}개</span>
        </button>
      </li>
    </ul>
  </main>
</template>

<!-- 공통 틀 -->
<template id="tpl-shell">
  <div class="yk-binder3 {{filmClass}}">
    <div class="b3-backdrop" aria-hidden="true" data-if="welcome">
      <video src="assets/welcome-abstract-loop.mp4" poster="assets/welcome-abstract-poster.png" autoplay muted loop playsinline preload="auto" tabindex="-1"></video>
    </div>
    <header class="b3-bar {{headerClass}}" data-unless="film">
      <span class="b3-ci b3-header-ci" role="img" aria-label="법무법인 YK"><img src="assets/yk-ci-korean-primary.svg" alt="" aria-hidden="true"></span>
      <span class="b3-place" data-if="case.placeLabel">{{case.placeLabel}}</span>
    </header>
    <main class="b3-content {{contentClass}}" id="b3-content"></main>
  </div>
</template>

<template id="tpl-journey">
  <nav class="b3-jnav" aria-label="상담 안내">
    <div class="b3-journey-client">
      <p class="b3-journey-greeting">안녕하세요,</p>
      <p class="b3-journey-name"><strong>{{case.customerName}}</strong><span> 고객님</span></p>
    </div>
    <button data-each="m in menu" type="button" class="{{m.className}}" data-disabled="m.disabled" data-action="go" data-arg="{{m.id}}">{{m.label}}</button>
    <div class="b3-journey-qr">
      <p class="b3-journey-qr-title">법률 과정을 더 쉽게,<br>의뢰인의 곁에 더 가까이</p>
      <p class="b3-journey-qr-description">상담과 사건 진행을 편리하게 확인하고 이어갈 수 있습니다.</p>
      <img src="assets/yourk-qr.svg" width="147" height="147" alt="YourK 접속 QR코드">
      <span class="b3-journey-qr-url">https://yourk.legal</span>
      <p class="b3-journey-qr-caption">QR코드를 스캔해 만나보세요.</p>
    </div>
  </nav>
</template>

<!-- 내방 확인 -->
<template id="tpl-confirm">
  <section class="b3-confirm">
    <div class="b3-confirm-main">
      <div class="b3-welcome-brand">
        <span class="b3-ci b3-welcome-ci" role="img" aria-label="법무법인 YK"><img src="assets/yk-ci-korean-primary.svg" alt="" aria-hidden="true"></span>
        <p class="b3-sub">법무법인 YK를 찾아주셔서 감사합니다.</p>
      </div>
      <div class="b3-help" role="region" data-if="wrong">
        <div role="status">
          <h2>예약 정보 확인을 도와드리겠습니다.</h2>
          <p class="b3-help-description">담당 직원이 예약 정보를 확인해 드립니다.<br>이 화면을 그대로 두시면 됩니다.</p>
        </div>
        <div class="b3-actions">
          <button type="button" class="b3-return" data-action="confirm-back"><svg class="b3-icon" width="20" height="20" aria-hidden="true"><use href="#i-left"/></svg><span>예약 정보 다시 보기</span></button>
        </div>
      </div>
      <div data-unless="wrong" style="display:contents">
        <h2 class="b3-title"><span class="b3-client-name">{{case.customerName}} </span>고객님, 반갑습니다.</h2>
        <div class="b3-check" role="group">
          <p class="b3-instruction">예약하신 시간과 장소를 확인해 주세요.</p>
          <div class="b3-who"><p>{{case.visitLabel}}</p><p>{{case.placeLabel}}</p></div>
        </div>
        <div class="b3-actions">
          <button type="button" class="b3-go" data-action="confirm-yes">네, 맞습니다</button>
          <button type="button" class="b3-ghost" data-action="confirm-wrong">제 예약이 아니에요</button>
        </div>
      </div>
    </div>
  </section>
</template>

<!-- 상담 준비 -->
<template id="tpl-prep">
  <section class="b3-confirm b3-prep">
    <div class="b3-confirm-main">
      <div class="b3-welcome-brand">
        <span class="b3-ci b3-welcome-ci" role="img" aria-label="법무법인 YK"><img src="assets/yk-ci-korean-primary.svg" alt="" aria-hidden="true"></span>
        <p class="b3-sub">법무법인 YK를 찾아주셔서 감사합니다.</p>
      </div>
      <h2 class="b3-prep-title">상담을 준비하고 있습니다.</h2>
      <p class="b3-prep-description">잠시 후 법무법인 YK 소개 영상이 시작됩니다.</p>
      <div class="b3-prep-loading" role="status" aria-label="상담 준비 중"><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span></div>
    </div>
  </section>
</template>

<!-- 소개 영상 -->
<template id="tpl-film">
  <section class="b3-film">
    <video autoplay muted playsinline preload="auto" src="assets/yk-brand-film.mp4"></video>
    <div class="b3-film-vignette"></div>
    <button type="button" class="b3-film-skip" data-action="film-done"><span>영상 건너뛰기</span><svg class="b3-icon" width="20" height="20" aria-hidden="true"><use href="#i-right"/></svg></button>
  </section>
</template>

<!-- YK 소개 -->
<template id="tpl-firm-people">
  <section class="b3-firm-sec" aria-label="{{title}}">
    <h4>{{title}}</h4>
    <ul class="b3-firm-people">
      <li data-each="p in rows">
        <span class="b3-firm-ph">
          <img data-if="p.photoUrl" src="{{p.photoUrl}}" alt="">
          <span data-unless="p.photoUrl" aria-hidden="true">{{p.initial}}</span>
        </span>
        <strong>{{p.name}}</strong>
        <span class="b3-firm-people-pos" data-if="p.position">{{p.position}}</span>
        <span class="b3-firm-people-t">{{p.title}}</span>
      </li>
    </ul>
  </section>
</template>
<template id="tpl-firm">
  <section class="b3-firm">
    <div class="b3-firm-body">
      <header class="b3-firm-hero">
        <h3><span class="b3-firm-headline-lead">고객중심 법률파트너</span>법무법인 YK</h3>
        <p class="b3-firm-en">People. Promise. Performance.</p>
        <dl class="b3-firm-stats">
          <div data-each="x in stats"><dt>{{x.label}}</dt><dd><strong>{{x.value}}</strong><span>{{x.unit}}</span></dd></div>
        </dl>
        <p class="b3-firm-note" data-if="asOf">{{asOf}}</p>
      </header>
      <div id="firm-bench"></div>
      <div id="firm-prosecution"></div>
      <section class="b3-firm-sec" data-if="hasAdvisorsOrPolice">
        <h4>고문 및 전문위원</h4>
        <p class="b3-firm-sec-lead">정부기관·경찰·입법 분야의 실무 경험을 바탕으로, 사안 검토에 필요한 전문적 관점을 더합니다.</p>
        <div class="b3-firm-subgroup" data-if="firm.advisors">
          <h5>고문</h5>
          <ul class="b3-firm-names"><li data-each="a in firm.advisors"><strong>{{a.name}}</strong><span data-if="a.label">{{a.label}}</span></li></ul>
        </div>
        <div class="b3-firm-subgroup" data-if="firm.police">
          <h5>경찰 경력 전문위원</h5>
          <ul class="b3-firm-names compact"><li data-each="a in firm.police"><strong>{{a.name}}</strong></li></ul>
        </div>
      </section>
      <section class="b3-firm-sec">
        <h4>분야별 전문 센터</h4>
        <p class="b3-firm-sec-lead">형사·가사·민사·기업 등 각 분야의 실무 경험을 바탕으로, 사건의 주요 쟁점과 대응 절차를 살핍니다.</p>
        <div class="b3-firm-centers">
          <div data-each="g in firm.centerGroups">
            <p class="b3-firm-group-t">{{g.title}}</p>
            <ul><li data-each="c in g.centers"><span class="b3-firm-center-n">{{c}}</span></li></ul>
          </div>
        </div>
      </section>
      <div class="b3-firm-next">
        <button type="button" data-action="go" data-arg="report"><span>사건 요약 보기</span><svg class="b3-icon" width="20" height="20" aria-hidden="true"><use href="#i-right"/></svg></button>
      </div>
    </div>
  </section>
</template>

<!-- 사건 요약 1뎁스 -->
<template id="tpl-check">
  <section class="b3-case-check" aria-label="사건 요약">
    <div class="b3-case-check-body">
      <h2>예약하실 때 말씀하신 내용입니다</h2>
      <p class="b3-case-check-lead">저희가 이해한 내용이 맞는지 확인해 주세요.<br>다른 부분은 상담에서 다시 여쭤보겠습니다.</p>
      <ol class="b3-case-check-list">
        <li data-each="q in questions">
          <p>{{q.text}}</p>
          <div class="b3-case-check-answers" role="group" aria-label="{{q.n}}번 확인">
            <button type="button" class="{{q.yesClass}}" aria-pressed="{{q.yesPressed}}" data-action="answer" data-arg="{{q.index}}:yes">네</button>
            <button type="button" class="{{q.noClass}}" aria-pressed="{{q.noPressed}}" data-action="answer" data-arg="{{q.index}}:no">아니오</button>
          </div>
        </li>
      </ol>
      <p class="b3-case-check-note">모든 항목에 네 또는 아니오를 골라 주세요. 고르신 답은 다른 쪽을 누르면 바뀝니다.</p>
      <div class="b3-counsel-links">
        <button type="button" class="b3-counsel-previous" data-action="go" data-arg="firm"><svg class="b3-icon" width="20" height="20" aria-hidden="true"><use href="#i-left"/></svg><span>법무법인 YK 소개로</span></button>
        <button type="button" class="b3-counsel-next" data-disabled="notAnswered" data-action="to-topics"><span>상담에서 함께 볼 내용</span><svg class="b3-icon" width="20" height="20" aria-hidden="true"><use href="#i-right"/></svg></button>
      </div>
    </div>
  </section>
</template>

<!-- 사건 요약 2뎁스 -->
<template id="tpl-report">
  <section class="b3-report" aria-label="사건 요약">
    <div class="b3-report-body">
      <h2>오늘 상담에서 함께 볼 내용입니다.</h2>
      <p class="b3-report-lead">같은 고민으로 찾아오신 분들이 상담에서 많이 확인하신 내용입니다.<br>정리해서 오실 필요는 없습니다. 이 순서로 편하게 말씀 나누시면 됩니다.</p>
      <div class="b3-report-field" data-if="fieldLabel"><span>상담 분야</span><strong>{{fieldLabel}}</strong></div>
      <section class="b3-report-party" data-if="options">
        <h3>어떤 경우에 해당하시나요?</h3>
        <p>고르시면 그에 맞는 내용으로 보여드립니다. 모르시면 넘어가셔도 됩니다.</p>
        <div class="b3-report-party-options">
          <button data-each="o in options" type="button" class="{{o.className}}" aria-pressed="{{o.pressed}}" data-action="party" data-arg="{{o.party}}">{{o.label}}</button>
        </div>
      </section>
      <section class="b3-report-section" data-if="steps">
        <h3>상담에서 함께 볼 내용</h3>
        <ol class="b3-report-steps">
          <li data-each="s in steps"><span class="n">{{s.n}}</span><div><h4>{{s.title}}</h4><p>{{s.text}}</p></div></li>
        </ol>
      </section>
      <section class="b3-report-section" data-if="flow">
        <h3>일반적인 진행 순서</h3>
        <ol class="b3-report-flow">
          <li data-each="f in flow"><span class="n">{{f.n}}</span><strong>{{f.title}}</strong><p>{{f.text}}</p></li>
        </ol>
      </section>
      <div class="b3-report-pair {{pairClass}}">
        <section data-if="ask"><h3>상담에서 여쭤볼 내용</h3><ul><li data-each="a in ask">{{a}}</li></ul></section>
        <section data-if="bring"><h3>가지고 계시면 도움이 되는 자료</h3><ul><li data-each="b in bring">{{b}}</li></ul><p class="b3-report-note">지금 없으셔도 괜찮습니다. 상담 후에 보내주셔도 됩니다.</p></section>
      </div>
      <section class="b3-report-section" data-if="cases">
        <h3>YK가 함께한 비슷한 사례</h3>
        <ul class="b3-report-cases {{casesClass}}">
          <li data-each="c in cases">
            <span class="tag" data-if="c.tag">{{c.tag}}</span>
            <strong data-if="c.t">{{c.t}}</strong>
            <p data-if="c.s">{{c.s}}</p>
            <span class="result" data-if="c.r">{{c.r}}</span>
          </li>
        </ul>
        <p class="b3-report-note">법무법인 YK 홈페이지 업무사례에서 골랐습니다. 사건마다 사정이 달라 결과도 다를 수 있습니다.</p>
      </section>
      <p class="b3-report-end">더 여쭤보고 싶은 점은 상담에서 편하게 말씀해 주세요.</p>
      <div class="b3-counsel-links">
        <button type="button" class="b3-counsel-previous" data-action="report-previous"><svg class="b3-icon" width="20" height="20" aria-hidden="true"><use href="#i-left"/></svg><span>{{previousLabel}}</span></button>
        <button type="button" class="b3-counsel-next" data-action="go" data-arg="counsel"><span>상담 변호사 확인하기</span><svg class="b3-icon" width="20" height="20" aria-hidden="true"><use href="#i-right"/></svg></button>
      </div>
    </div>
  </section>
</template>

<!-- 상담 변호사 / 전문 인력 상세 -->
<template id="tpl-profile">
  <section class="b3-counsel" aria-label="{{ariaLabel}}">
    <div class="b3-counsel-hero">
      <div class="b3-counsel-backdrop" aria-hidden="true">
        <video src="assets/welcome-abstract-loop.mp4" poster="assets/welcome-abstract-poster.png" muted loop playsinline preload="auto" tabindex="-1"></video>
      </div>
      <div class="b3-specialist-back" data-if="specialist">
        <button type="button" data-action="senior-back"><svg class="b3-icon" width="20" height="20" aria-hidden="true"><use href="#i-left"/></svg><span>전문 인력 목록</span></button>
      </div>
      <div class="b3-counsel-lead">
        <div class="b3-counsel-photo">
          <img data-if="p.photoUrl" src="{{p.photoUrl}}" alt="{{p.name}} {{p.position}}">
          <span data-unless="p.photoUrl" aria-hidden="true">{{p.initial}}</span>
        </div>
        <div class="b3-counsel-ident">
          <p class="b3-counsel-quote" data-if="hero.greeting">{{hero.greeting}}</p>
          <div class="b3-counsel-divider" aria-hidden="true" data-if="hero.greeting"></div>
          <div class="b3-counsel-titles" data-if="hero.titles"><span data-each="t in hero.titles">{{t}}</span></div>
          <div class="b3-counsel-who"><strong>{{p.name}}</strong><em>{{p.position}}</em></div>
          <p class="b3-counsel-edu" data-if="edu">{{edu}}</p>
        </div>
      </div>
    </div>
    <div class="b3-counsel-layout">
      <aside class="b3-counsel-card" aria-hidden="true">
        <div class="b3-counsel-card-photo">
          <img data-if="p.photoUrl" src="{{p.photoUrl}}" alt="{{p.name}} {{p.position}}">
          <span data-unless="p.photoUrl" aria-hidden="true">{{p.initial}}</span>
        </div>
        <div class="b3-counsel-card-content">
          <div class="b3-counsel-card-identity"><strong>{{p.name}}</strong><span>{{p.position}}</span></div>
          <nav class="b3-counsel-index" aria-label="소개 목차"></nav>
        </div>
      </aside>
      <div class="b3-counsel-details">
        <header class="b3-counsel-intro">
          <h2>{{introTitle}}</h2>
          <p>{{introName}}의 주요 업무 분야와 이력을 정리했습니다.<br>고객님의 상황과 관련된 경험과 사례를 살펴보세요.</p>
        </header>
        <section class="b3-detail-group" data-if="hasWork">
          <h3>업무 분야 및 사례</h3>
          <div class="b3-detail-group-body">
            <section class="b3-detail-sub" data-if="fields">
              <h4>주요 업무 분야</h4>
              <ul class="b3-field-keywords"><li data-each="f in fields" class="{{f.className}}"><span>{{f.name}}</span></li></ul>
            </section>
            <section class="b3-detail-sub b3-counsel-results" data-if="p.performance">
              <h4>주요 업무 실적</h4>
              <ul class="b3-clist"><li data-each="t in p.performance">{{t}}</li></ul>
            </section>
            <section class="b3-detail-sub b3-counsel-works" data-if="p.works">
              <h4>관련 업무 사례</h4>
              <ul class="b3-clist"><li data-each="w in p.works"><button type="button" class="b3-case-link" data-action="open-case" data-arg="{{w.id}}"><span>{{w.title}}</span><svg width="20" height="20" aria-hidden="true"><use href="#i-up-right"/></svg></button></li></ul>
            </section>
          </div>
        </section>
        <section class="b3-detail-group" data-if="hasHistory">
          <h3>이력 사항</h3>
          <div class="b3-detail-group-body">
            <section class="b3-detail-sub b3-counsel-career" data-if="p.career">
              <h4>주요 경력</h4>
              <ul class="b3-clist"><li data-each="c in career" data-hidden="c.extra">{{c.text}}</li></ul>
              <button class="b3-career-toggle" type="button" aria-expanded="false" data-if="moreCareer" data-action="career-toggle"><span>경력 더 보기 <span class="b3-career-toggle-count">({{moreCareer}}개)</span></span><svg width="20" height="20" aria-hidden="true"><use href="#i-chev-down"/></svg></button>
            </section>
            <section class="b3-detail-sub" data-if="p.awards"><h4>수상 내역</h4><ul class="b3-clist"><li data-each="t in p.awards">{{t}}</li></ul></section>
            <section class="b3-detail-sub" data-if="p.papers"><h4>논문·저서</h4><ul class="b3-clist"><li data-each="t in p.papers">{{t}}</li></ul></section>
          </div>
        </section>
        <div class="b3-counsel-links" data-unless="specialist">
          <button type="button" class="b3-counsel-previous" data-action="to-topics-direct"><svg class="b3-icon" width="20" height="20" aria-hidden="true"><use href="#i-left"/></svg><span>사건 요약으로</span></button>
          <button type="button" class="b3-counsel-next" data-action="go" data-arg="seniors"><span>전문 인력 살펴보기</span><svg class="b3-icon" width="20" height="20" aria-hidden="true"><use href="#i-right"/></svg></button>
        </div>
      </div>
    </div>
  </section>
</template>

<!-- 전문 인력 목록 -->
<template id="tpl-seniors">
  <section class="b3-seniors" aria-label="전문 인력">
    <div class="b3-seniors-content">
      <h2 class="b3-seniors-title">다양한 경험을 갖춘 전문 인력을 소개합니다.</h2>
      <p class="b3-seniors-sub">주요 업무 분야와 경력을 살펴보세요.<br>프로필을 누르면 자세한 정보를 확인하실 수 있습니다.</p>
      <div class="b3-senior-stage">
        <div class="b3-senior-sides">
          <button type="button" class="b3-senior-side" aria-label="이전 전문 인력" data-action="senior-move" data-arg="-1"><svg width="20" height="20" aria-hidden="true"><use href="#i-chev-left"/></svg></button>
          <button type="button" class="b3-senior-side" aria-label="다음 전문 인력" data-action="senior-move" data-arg="1"><svg width="20" height="20" aria-hidden="true"><use href="#i-chev-right"/></svg></button>
        </div>
        <div class="b3-senior-track" role="region" aria-label="전문 인력 목록" aria-roledescription="캐러셀"></div>
      </div>
      <div class="b3-senior-focused-slot" style="display:contents"></div>
      <div class="b3-senior-controls">
        <span>전체 {{count}}명</span>
        <div class="b3-senior-arrows">
          <button type="button" class="b3-senior-auto" aria-label="자동 넘김 일시정지" data-action="senior-pause">일시정지</button>
          <button type="button" class="b3-senior-arrow" aria-label="이전 전문 인력" data-action="senior-move" data-arg="-1"><svg width="20" height="20" aria-hidden="true"><use href="#i-left"/></svg></button>
          <button type="button" class="b3-senior-arrow" aria-label="다음 전문 인력" data-action="senior-move" data-arg="1"><svg width="20" height="20" aria-hidden="true"><use href="#i-right"/></svg></button>
        </div>
      </div>
    </div>
  </section>
</template>
<template id="tpl-senior-card">
  <button type="button" class="b3-senior-card" aria-label="{{p.name}} {{p.position}} 프로필">
    <span class="b3-senior-shot">
      <img data-if="p.photoUrl" src="{{p.photoUrl}}" alt="">
      <span class="b3-senior-mono" data-unless="p.photoUrl">{{p.initial}}</span>
    </span>
    <span class="b3-senior-body">
      <span class="b3-senior-identity">
        <span class="b3-senior-headline" data-if="headline">{{headline}}</span>
        <span class="b3-senior-name-row"><strong>{{p.name}}</strong><span>{{p.position}}</span></span>
      </span>
      <span class="b3-senior-h" data-if="career">주요 경력</span>
      <ul class="b3-senior-career" data-if="career"><li data-each="c in career">{{c}}</li></ul>
      <span class="b3-senior-h" data-if="fields">업무 분야</span>
      <ul class="b3-field-keywords" data-if="fields"><li data-each="f in fields" class="{{f.className}}"><span>{{f.name}}</span></li></ul>
    </span>
  </button>
</template>
<template id="tpl-senior-focused">
  <div class="b3-senior-focused" aria-live="off">
    <p class="b3-senior-focused-career" data-if="headline">{{headline}}</p>
    <p class="b3-senior-focused-name"><strong>{{p.name}}</strong><span>{{p.position}}</span></p>
    <button type="button" data-action="senior-open-focused">프로필 보기<svg width="20" height="20" aria-hidden="true"><use href="#i-right"/></svg></button>
  </div>
</template>

<template id="tpl-case-preview">
  <main class="yk-binder3">
    <button class="review-home" type="button" data-action="open-case" data-arg="{{id}}">업무 사례 다시 열기</button>
  </main>
</template>

<!-- 업무 사례 모달 -->
<template id="tpl-case-modal">
  <div class="b3-case-modal" role="dialog" aria-modal="true" aria-labelledby="b3-case-modal-title" data-action="close-case">
    <div class="b3-case-modal-panel" data-action="stop">
      <header class="b3-case-modal-bar">
        <h2 class="b3-case-modal-title" id="b3-case-modal-title">{{title}}</h2>
        <button type="button" aria-label="닫기" data-action="close-case"><svg width="20" height="20" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>
      <iframe title="{{title}}" sandbox=""></iframe>
    </div>
  </div>
</template>

<script src="data.js?v=20261111-members"></script>
<script src="binder3.js?v=shared-profile-hero"></script>
</body>
</html>
